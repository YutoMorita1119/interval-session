<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interval Session - Harmonic Experiment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 text-gray-800 antialiased h-screen w-screen overflow-hidden flex flex-col">

    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-lg shadow-xl text-center">
            <div class="loader mx-auto mb-4"></div>
            <p id="loading-text" class="text-lg font-medium">接続中...</p>
        </div>
    </div>

    <div id="session-container" class="max-w-md mx-auto mt-20 p-8 bg-white rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold text-center mb-6">ようこそ</h1>
        <div class="space-y-4">
            <div>
                <label for="management-id-input" class="block text-sm font-medium text-gray-700">あなたの管理ID (例: P1,
                    SubjectA)</label>
                <input type="text" id="management-id-input" placeholder="研究用の管理IDを入力..."
                    class="mt-1 block w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>
            <div class="relative flex items-center pt-4">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="flex-shrink mx-4 text-gray-500 text-sm">セッションを選択</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>
            <button id="create-session-btn"
                class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                新しいセッションを作成する
            </button>
            <div class="flex space-x-2">
                <input type="text" id="session-id-input" placeholder="セッションIDを入力..."
                    class="flex-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
                <button id="join-session-btn"
                    class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
                    参加
                </button>
            </div>
        </div>
    </div>

    <div id="game-container" class="hidden flex-col h-full w-full bg-white overflow-hidden">

        <header
            class="h-16 bg-white border-b border-gray-200 flex justify-between items-center px-6 shadow-sm z-30 flex-none">
            <div class="flex items-center gap-4">
                <h2 class="text-xl font-bold text-gray-700 tracking-tight">Interval Session</h2>
                <div id="status-badge"
                    class="bg-blue-50 text-blue-700 px-3 py-1 rounded-full text-sm font-semibold border border-blue-100 flex items-center">
                    <span class="w-2 h-2 bg-blue-500 rounded-full mr-2 animate-pulse"></span>
                    <span id="turn-status-text">Waiting...</span>
                </div>
            </div>

            <div class="group relative">
                <div
                    class="bg-gray-50 hover:bg-gray-100 px-4 py-2 rounded-lg border border-gray-200 cursor-help transition">
                    <span class="text-[10px] text-gray-400 font-bold block uppercase">Secret Theme</span>
                    <span id="my-theme-text"
                        class="font-bold text-gray-800 text-lg blur-md group-hover:blur-0 transition duration-300 select-none">
                        ????
                    </span>
                </div>
                <div
                    class="absolute right-0 mt-2 w-48 bg-gray-800 text-white text-xs p-3 rounded shadow-xl hidden group-hover:block z-50">
                    これがお題です。<br>相手には秘密にして、和音で表現してください。
                </div>
            </div>
        </header>

        <div class="flex-grow flex overflow-hidden">

            <main class="flex-1 flex flex-col min-w-0 min-h-0 relative bg-white">

                <div
                    class="h-10 bg-gray-50 border-b border-gray-200 flex text-gray-500 text-sm font-mono relative z-20 flex-none">
                    <div class="w-12 flex-none border-r border-gray-200 bg-gray-100"></div>
                    <div class="flex-1 flex relative">
                        <div class="flex-1 border-r border-gray-200 flex items-center justify-center font-bold">Bar 1
                            (C)</div>
                        <div class="flex-1 border-r border-gray-200 flex items-center justify-center font-bold">Bar 2
                            (F)</div>
                        <div class="flex-1 border-r border-gray-200 flex items-center justify-center font-bold">Bar 3
                            (G)</div>
                        <div class="flex-1 border-r border-gray-200 flex items-center justify-center font-bold">Bar 4
                            (C)</div>
                        <div id="playhead-top" class="playhead h-full" style="left: 0%;"></div>
                    </div>
                </div>

                <div id="piano-roll-viewport" class="flex-grow overflow-y-auto piano-scroll relative bg-white">
                    <div id="piano-roll-content" class="flex w-full relative">
                        <div id="piano-keys-layer"
                            class="w-12 flex-none keys-container flex flex-col sticky left-0 z-30"></div>
                        <div id="grid-layer" class="flex-grow grid-container relative">
                            <div id="playhead-body" class="playhead h-full" style="left: 0%;"></div>
                        </div>
                    </div>
                    <div id="turn-lock-overlay"
                        class="absolute inset-0 turn-lock flex items-center justify-center z-40 hidden">
                        <div class="text-center">
                            <div class="loader mx-auto mb-4 border-t-gray-500"></div>
                            <p class="text-xl font-bold text-gray-600">Opponent is thinking...</p>
                        </div>
                    </div>
                </div>

                <div
                    class="h-20 bg-white border-t border-gray-200 flex items-center px-8 justify-between shadow-[0_-4px_10px_rgba(0,0,0,0.03)] z-30 flex-none">
                    <button id="preview-btn"
                        class="flex items-center space-x-3 text-gray-600 hover:text-blue-600 transition group">
                        <div
                            class="w-12 h-12 rounded-full bg-gray-50 group-hover:bg-blue-50 flex items-center justify-center border border-gray-200 group-hover:border-blue-200 transition">
                            <svg class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 20 20">
                                <path
                                    d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z" />
                            </svg>
                        </div>
                        <div class="text-left">
                            <span class="block text-sm font-bold">Preview</span>
                            <span class="block text-[10px] text-gray-400">Play current loop</span>
                        </div>
                    </button>

                    <div class="flex items-center gap-6">
                        <div class="text-right">
                            <div class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Polyphony</div>
                            <div class="font-mono text-gray-700">
                                <span id="note-count-display" class="text-xl font-bold">0</span> <span
                                    class="text-gray-400">/ 8</span>
                            </div>
                        </div>
                        <button id="commit-btn"
                            class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition transform active:scale-95 disabled:opacity-30 disabled:cursor-not-allowed">
                            COMMIT TURN
                        </button>
                    </div>
                </div>
            </main>

            <aside class="w-80 bg-gray-50 border-l border-gray-200 flex flex-col z-20 shadow-xl flex-none">
                <div class="p-5 border-b border-gray-200 bg-white">
                    <h3 class="font-bold text-gray-800 flex items-center gap-2">
                        <span>📝</span> Research Log
                    </h3>
                    <p class="text-xs text-gray-400 mt-1">※相手には公開されません</p>
                </div>
                <div class="p-5 flex-grow space-y-6 overflow-y-auto">
                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide">
                            Hypothesis <span class="text-gray-300 font-normal ml-1">(相手の意図)</span>
                        </label>
                        <textarea id="log-hypothesis"
                            class="w-full p-3 text-sm border border-gray-300 rounded-lg h-24 bg-white shadow-sm transition"
                            placeholder="今の音を聴いて..."></textarea>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide">
                            Intention <span class="text-gray-300 font-normal ml-1">(自分の戦略)</span>
                        </label>
                        <textarea id="log-intention"
                            class="w-full p-3 text-sm border border-gray-300 rounded-lg h-24 bg-white shadow-sm transition"
                            placeholder="今回の意図..."></textarea>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
